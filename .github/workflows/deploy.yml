name: Deploy Mahkam Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Never run two deploys at once (parallel runs caused git/docker lock failures).
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          port: ${{ secrets.DEPLOY_PORT }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 60m
          script: |
            set -euo pipefail

            APP_DIR="/var/www/mahkam-website"
            REPO_SSH="git@github.com:behbahanisahar/mahkam-website.git"
            REPO_HTTPS="https://github.com/behbahanisahar/mahkam-website.git"

            mkdir -p /var/www
            cd /var/www

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "No git repo at $APP_DIR — cloning fresh..."
              if [ -d "$APP_DIR" ]; then
                ts=$(date +%F-%H%M%S)
                if [ -f "$APP_DIR/.env" ]; then
                  cp -a "$APP_DIR/.env" "/root/mahkam.env.bak.$ts"
                  echo "Saved .env to /root/mahkam.env.bak.$ts"
                fi
                mv "$APP_DIR" "${APP_DIR}.bak.$ts"
              fi
              if git clone "$REPO_SSH" mahkam-website; then
                echo "Cloned via SSH"
              else
                echo "SSH clone failed; trying HTTPS..."
                git clone "$REPO_HTTPS" mahkam-website
              fi
              if [ -f /root/mahkam.env.bak.* ]; then
                latest=$(ls -1t /root/mahkam.env.bak.* | head -1)
                cp -a "$latest" "$APP_DIR/.env"
                echo "Restored .env from $latest"
              fi
            fi

            cd "$APP_DIR"
            echo "Starting deployment..."

            git fetch origin main
            git reset --hard origin/main

            chmod +x scripts/deploy/vps-rebuild.sh scripts/deploy/vps-recover.sh scripts/deploy/restore-env.sh
            if [[ ! -f .env ]]; then
              bash scripts/deploy/restore-env.sh || true
            fi
            bash scripts/deploy/vps-rebuild.sh --sync-catalog

            docker ps
            echo "Deployment completed."
