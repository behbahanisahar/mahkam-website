services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://mahkamcable.ir}
        NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-گسترش سیم و کابل مهکام}
        NEXT_PUBLIC_HERO_IMAGE: ${NEXT_PUBLIC_HERO_IMAGE:-/images/hero-minimal.webp}
        DATABASE_URL: ${DATABASE_URL}
    container_name: mahkam-website
    restart: unless-stopped
    # Use the VPS network stack so Postgres on localhost works reliably
    # (avoids Docker bridge / pg_hba denials from 172.18.x.x).
    network_mode: host
    env_file:
      - .env
    environment:
      UPLOAD_DIR: /var/www/mahkam-uploads
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      # Prefer loopback when using host networking (override if set in .env)
      # DATABASE_URL should use 127.0.0.1:5432 — see .env.example
    volumes:
      - /var/www/mahkam-uploads:/var/www/mahkam-uploads
