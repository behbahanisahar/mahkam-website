# Mahkam — static 502/503/504 page (served from disk when Next/Docker is down)
#
# Add INSIDE the HTTPS server { } block for mahkamcable.ir
# BEFORE the catch-all `location / { proxy_pass ... }` block.
#
# Files live at: /var/www/mahkam-website/public/errors/offline.html
#
# After editing:
#   sudo nginx -t && sudo systemctl reload nginx
#
# Test (should return HTML even when Docker is stopped):
#   curl -sS -o /dev/null -w "%{http_code}\n" https://mahkamcable.ir/errors/offline.html

# Serve /errors/* directly from disk — never proxy to Node
location ^~ /errors/ {
    alias /var/www/mahkam-website/public/errors/;
    default_type text/html;
    charset utf-8;
    access_log off;
    add_header Cache-Control "no-store";
    add_header X-Content-Type-Options nosniff;
}

# Friendly page when upstream (Next.js :3000) is unreachable
error_page 502 503 504 /errors/offline.html;

location = /errors/offline.html {
    root /var/www/mahkam-website/public;
    internal;
    default_type text/html;
    charset utf-8;
    add_header Cache-Control "no-store";
}
